
<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6K30PSWNJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6K30PSWNJW');

  <meta charset="UTF-8">
  <title>さくら申込フォーム</title>

  <!-- CONNECT CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== SPLASH ===== -->
  <div id="splash">
    <img src="Sakura.png.png" alt="Sakura">
  </div>

  <!-- ===== HEADER ===== -->
  <header id="header">
    <div class="header-inner">
      <div class="logo">
        <img src="Sakura.png.png" alt="Logo">
        <span>Sakura Houkago</span>
      </div>

      <div class="menu">
        <a href="https://www.instagram.com/igs_sakurahoukago.club" target="_blank">
          <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="IG">
          Social Media
        </a>
      </div>
    </div>
  </header>

  <div class="zigzag" id="zigzag"></div>

  <!-- ===== FORM ===== -->
  <div class="overlay" id="overlay">
    <div class="container">

      <div id="formBox">
      <h1>🌸 Sakura Houkago 🌸<br>Recruitment Form</h1>
      <p class="jp">富士山・桜・日本</p>

      <form
        action="https://docs.google.com/forms/d/e/1FAIpQLSdT0jmHTeLCGrA7hn__IMY0jHfTuzGwa-tLLu2h_hSGmknOKQ/formResponse"
        method="POST"
        target="hidden_iframe"
        onsubmit="submitted=true;">

        <label>⁡名前を教えてください？<br>(⁡tolong beri tahu namamu)</label>
        <input type="text" name="entry.1227597404" required>

        <label> 中学生ですか高校生ですか?<br>(⁡Apakah kamu SMP atau SMA? ⁡)</label>
        <select name="entry.287472053" required>
          <option value="" disabled selected>-- pilih --</option>
          <option value="Sma">Sma</option>
          <option value="Smp">Smp</option>
        </select>

        <label>何年何組ですか？<br>(⁡kamu Kelas berapa? cnth 8A, 12.1)</label>
        <input type="text" name="entry.1708316230" required>

        <label>電話番号かLINEを教えてください<br>(Tolong beritahu nomor hp atau id linenya)</label>
        <input type="text" name="entry.1037671053" required>

        <label>桜放課後クラブに参加したい理由は何ですか?</br>⁡Apa alasan kamu bergabung di Sakura Houkago club</label>
        <input type="text" name="entry.267976602" required>

        <button type="submit">🌸 送信 / Kirim 🌸</button>
      </form>
    </div>

    <!-- ===== THANK YOU BOX ===== -->
    <div id="thankYouBox" class="thankyou">
      <h2>🌸 ありがとうございます 🌸<br>
      Silahkan masuk grup nya!</h2>

      <a href="https://line.me/R/ti/g/cnv6xsXv9A" target="_blank">🌸 Line Group 🌸</a>
    </div>
      </div>
    </div>
  </div>

  <!-- ===== HIDDEN IFRAME ===== -->
  <iframe name="hidden_iframe" style="display:none"
    onload="if(submitted){
      document.getElementById('formBox').style.display='none';
      document.getElementById('thankYouBox').style.display='block';
    }">
  </iframe>

  <!-- ===== SCRIPT ===== -->
  <script>
    let submitted = false;

    document.addEventListener("DOMContentLoaded", () => {
      const splash = document.getElementById("splash");
      const header = document.getElementById("header");
      const zigzag = document.getElementById("zigzag");
      const overlay = document.getElementById("overlay");

      setTimeout(() => {
        splash.classList.add("hide");
        header.classList.add("show");
        zigzag.classList.add("show");
        overlay.classList.add("show");
      }, 1800);
    });
  </script>

</body>
</html>

</div>
